name: minhaai-local
services:
  db:
    image: postgres:16.15-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Run make setup}
      POSTGRES_USER: ${POSTGRES_USER:?Run make setup}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run make setup}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  postgres_data:
