name: Baseline checks
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.15-bookworm
        env:
          POSTGRES_DB: minhaai
          POSTGRES_USER: minhaai
          POSTGRES_PASSWORD: ci-only-db
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U minhaai -d minhaai"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      POSTGRES_PASSWORD: ci-only-db
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies and generate private local environment
        run: make setup
      - name: Apply PostgreSQL migrations
        run: make migrate
      - name: Unit, contract, static and secret checks
        run: make check
      - name: Build frontend
        run: make build
      - name: Real HTTP startup and worker preflight
        run: make smoke worker-check
